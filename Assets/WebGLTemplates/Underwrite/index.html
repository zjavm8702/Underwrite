<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120d09; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #120d09; }
    #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; text-align: center;
      font-family: sans-serif; color: #e8d3a8; font-size: 15px; }
    #bar { margin-top: 12px; height: 6px; border: 1px solid #8a6a3e; border-radius: 3px; }
    #fill { width: 0%; height: 100%; background: #d9a95b; }
    #error { display: none; position: absolute; left: 0; right: 0; top: 0; padding: 12px; background: #5a1a14; color: #fff;
      font-family: sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">불러오는 중…<div id="bar"><div id="fill"></div></div></div>
  <div id="error"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: function (message, type) {
        if (type === "error") {
          var box = document.querySelector("#error");
          box.textContent = message;
          box.style.display = "block";
        }
      }
    };
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        config.showBanner(String(message), "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
